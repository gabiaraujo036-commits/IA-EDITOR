<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mário Car Finados</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800;900&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Same template as the 12 de Outubro post: store photo bg, logo top, symbol card, red bars + big date + red "NÃO ABRIREMOS" pill */
:root{ --ink:#0F0F11; --red:#E1312A; --white:#FFFFFF; --soft:#EDEDF0; }
body{margin:0;background:#000}
.board{position:relative;width:1080px;overflow:hidden;background:var(--ink);color:var(--white);
  font-family:'Saira Condensed','Arial Narrow',sans-serif}
.feed{height:1350px}
.story{height:1920px}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;opacity:.4;filter:grayscale(.35)}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 560px 600px at 50% 38%, rgba(0,0,0,.78) 0%, rgba(0,0,0,.5) 50%, rgba(0,0,0,0) 100%)}
.story .vignette{background:radial-gradient(ellipse 600px 820px at 50% 42%, rgba(0,0,0,.78) 0%, rgba(0,0,0,.5) 50%, rgba(0,0,0,0) 100%)}
.wrap{position:absolute;inset:0;box-sizing:border-box;padding:76px 80px 80px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.story .wrap{padding:230px 80px 300px}
.brand{display:flex;align-items:center;gap:8px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.brand img{width:100px;height:62px;display:block}
.brand span{font-size:42px;font-weight:700;letter-spacing:.5px;line-height:1}

.card{width:360px;height:420px;border-radius:24px;overflow:hidden;position:relative;
  background:radial-gradient(circle at 50% 34%, rgba(255,190,110,.32) 0%, rgba(255,190,110,.08) 30%, rgba(15,15,17,.92) 62%), #141417;
  box-shadow:0 30px 60px rgba(0,0,0,.65), 0 8px 18px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.08)}
.story .card{width:400px;height:480px}
.card svg{position:absolute;inset:0;width:100%;height:100%}

.bottom{display:flex;flex-direction:column;align-items:center;gap:22px}
.kicker{display:flex;align-items:center;gap:20px;text-shadow:0 4px 16px rgba(0,0,0,.8)}
.kicker i{width:60px;height:5px;background:var(--red)}
.kicker b{font-size:46px;font-weight:800;letter-spacing:3px;line-height:1}
.date{font-size:150px;font-weight:900;line-height:.9;text-shadow:0 8px 28px rgba(0,0,0,.7)}
.pill{background:var(--red);border-radius:10px;padding:12px 34px 10px;font-size:52px;font-weight:800;letter-spacing:2px;line-height:1;box-shadow:0 14px 30px rgba(0,0,0,.55)}
.note{font-family:'Barlow',sans-serif;font-size:32px;font-weight:600;line-height:1.35;color:var(--soft);text-shadow:0 3px 12px rgba(0,0,0,.8);margin-top:6px}
.story .date{font-size:150px;white-space:nowrap}
.story .bottom{gap:30px}
</style>
</head>
<body>
<template id="tpl">
  <img class="bg" src="assets/fachada.jpg" alt="">
  <div class="vignette"></div>
  <div class="wrap">
    <div class="brand"><img src="assets/logo.png" alt="Logo Mário Car"><span>MÁRIO CAR</span></div>

    <div class="card">
      <svg viewBox="0 0 360 420" aria-hidden="true">
        <defs>
          <radialGradient id="halo" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ffd59a" stop-opacity=".75"/>
            <stop offset=".45" stop-color="#ffb35c" stop-opacity=".22"/>
            <stop offset="1" stop-color="#ffb35c" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="wax" x1="0" x2="1">
            <stop offset="0" stop-color="#d9d6cf"/><stop offset=".45" stop-color="#fbfaf7"/><stop offset="1" stop-color="#bdb9b1"/>
          </linearGradient>
          <radialGradient id="flame" cx="50%" cy="70%" r="60%">
            <stop offset="0" stop-color="#fffbe8"/><stop offset=".5" stop-color="#ffd66b"/><stop offset="1" stop-color="#ff8a2a"/>
          </radialGradient>
        </defs>
        <circle cx="180" cy="128" r="120" fill="url(#halo)"/>
        <!-- flame -->
        <path d="M180 88 C 196 112, 198 132, 180 150 C 162 132, 164 112, 180 88 Z" fill="url(#flame)"/>
        <path d="M180 116 C 187 128, 187 138, 180 146 C 173 138, 173 128, 180 116 Z" fill="#fff6d8"/>
        <rect x="178.5" y="146" width="3" height="12" rx="1.5" fill="#2a2522"/>
        <!-- candle -->
        <path d="M150 160 Q180 152 210 160 L210 330 L150 330 Z" fill="url(#wax)"/>
        <path d="M150 160 Q180 168 210 160" fill="none" stroke="#e9e6df" stroke-width="2"/>
        <path d="M196 162 q4 22 0 38 q-3 8 -6 0 q-3 -16 0 -36 Z" fill="#f3f1ec" opacity=".9"/>
        <!-- base -->
        <ellipse cx="180" cy="334" rx="62" ry="12" fill="#2a2a30"/>
        <rect x="118" y="330" width="124" height="16" rx="4" fill="#232328"/>
        <ellipse cx="180" cy="346" rx="62" ry="10" fill="#1a1a1e"/>
        <!-- red accent line from the brand -->
        <rect x="150" y="376" width="60" height="4" fill="#E1312A"/>
      </svg>
    </div>

    <div class="bottom">
      <div class="kicker"><i></i><b>FERIADO DE<br>FINADOS</b><i></i></div>
      <div class="date">2 DE NOVEMBRO</div>
      <div class="pill">NÃO ABRIREMOS</div>
      <div class="note">Dia de lembrar quem amamos · Voltamos na terça-feira, 03/11.</div>
    </div>
  </div>
</template>
<div class="board feed" id="feed"></div>
<div class="board story" id="story"></div>
<script>
  const t = document.getElementById('tpl');
  for (const id of ['feed','story']) document.getElementById(id).appendChild(t.content.cloneNode(true));
</script>
</body>
</html>
